<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f6f3" />
<title>每日一小步｜閱讀思考七關（原型測試站）</title>
<style>
:root{--ink:#1B2430;--muted:#5B6472;--canvas:#F7F6F3;--surface:#FFF;--line:#E3E1DA;--blue:#2752E7;--blue-soft:#EAF0FF;--navy:#14213D;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;color:var(--ink);background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{width:min(100%,720px);margin:0 auto;padding:64px 24px 48px;min-height:100vh}
.eyebrow{display:inline-block;padding:4px 12px;background:var(--blue-soft);color:var(--blue);border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em;margin-bottom:12px}
h1{font-size:26px;line-height:1.32;font-weight:800;letter-spacing:-.01em;margin:0 0 8px}
.lede{color:var(--muted);font-size:14.5px;margin:0 0 22px}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:14px;transition:border-color .15s ease}
.card:hover{border-color:var(--blue)}
.card .no{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:4px}
.card .t{font-size:17px;font-weight:800;margin-bottom:4px}
.card .d{font-size:13.5px;color:var(--muted)}
.card .go{margin-top:12px;font-size:13.5px;font-weight:800;color:var(--blue)}
.foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">樂寫學習網・每日一小步</span>
  <h1>閱讀思考七關<br>原型測試站</h1>
  <p class="lede">選一本自己想讀的書，完成七個閱讀思考關卡，把閱讀變成一篇有證據、有觀點、看得見修改歷程的文章。</p>

  <a class="card" href="demo.html">
    <div class="no">01</div>
    <div class="t">可操作示範版</div>
    <div class="d">從選書開始實際操作：方法說明、關卡地圖、七個關卡（深思關卡無範例、先填三個關鍵詞）、文章組裝（自己整理／AI 協作）、志工審閱區。</div>
    <div class="go">開始操作 →</div>
  </a>

  <a class="card" href="result.html">
    <div class="no">02</div>
    <div class="t">結果範例版</div>
    <div class="d">以《小王子》為例：七關全部填好、AI 協作歷程揭露、產出最終文章、志工評量與三件回饋。</div>
    <div class="go">查看完成結果 →</div>
  </a>

  <p class="foot">此為產品原型測試頁，非正式上線功能。<br>資料僅儲存在你自己的裝置上。</p>
</div>
</body>
</html>
